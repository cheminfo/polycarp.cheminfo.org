server {
    listen 80;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /preprocess_all may run a live XTB calculation on a cache miss
        # (minutes). nginx's default proxy_read_timeout of 60s would 504.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /view {
        return 301 /view/;
    }

    location /view/ {
        alias /usr/share/nginx/view/;
        index index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # A routed address is a real file: /results serves results/index.html,
        # with its own title, description and canonical. Anything unknown falls
        # back to the home page, as the frontend router does.
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
