<!doctype html>
<html lang="en">
  <head>
    <!-- Where this deployment is mounted. The build itself carries no mount —
         its assets are relative — so this is what resolves them, and what the
         page reads its own mount back off. A deployment serving the site under
         a path rewrites it, which is how one build serves this site's own host
         and a path of a shared one. It has to come before anything it
         resolves. -->
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!--cheminfo:head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <!--cheminfo:body-->
  </body>
</html>
