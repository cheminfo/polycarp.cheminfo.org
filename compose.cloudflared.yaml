# Cloudflare Tunnel deployment — no port published on the host.
#
# Cloudflare dashboard (https://dash.cloudflare.com):
#   Networking → Tunnels → Create a tunnel → Cloudflared connector →
#   copy the token into .env as TUNNEL_TOKEN=... → open the tunnel →
#   Published applications tab → add application with
#   Service = HTTP, URL = frontend:80.
#
# Select via COMPOSE_FILE=compose.cloudflared.yaml in .env, then: docker compose up -d
services:
  frontend:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/polycarp.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    # What the server's deploy script probes before it keeps a new container.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - path: .env
        required: false
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    # No cap_drop: ALL — nginx needs CHOWN/SETUID/SETGID to spawn its workers.
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    ulimits:
      core: 0
    tmpfs:
      - /usr/share/nginx:size=64m
      - /var/cache/nginx:size=50m
      - /var/run:size=10m
      - /tmp:size=10m
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    restart: unless-stopped
    stop_grace_period: 3s
    depends_on:
      - backend

  backend:
    # Externally built ML/XTB image: its required capabilities and temp paths are
    # unknown, so cap_drop and read_only are deliberately omitted here.
    # pin-ok: built by lamalab-org, and this site tracks their latest on
    # purpose; BACKEND_IMAGE overrides it to pin a known-good digest.
    image: ${BACKEND_IMAGE:-ghcr.io/lamalab-org/copolymer-reactivity:latest}
    env_file:
      - path: .env
        required: false
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    cpus: 2
    pids_limit: 512
    ulimits:
      core: 0
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    restart: unless-stopped
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file:
      - path: .env
        required: false
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    ulimits:
      core: 0
    logging:
      options:
        max-size: '5m'
        max-file: '2'
    restart: unless-stopped
