# Traefik deployment — requires an external Docker network named "traefik"
# with a "websecure" entrypoint and a "letsencrypt" cert resolver.
# Select via COMPOSE_FILE=compose.traefik.yaml in .env, then: docker compose up -d
services:
  frontend:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/polycarp.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    env_file: .env
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.polycarp.rule=Host(`${DOMAIN:-polycarp.cheminfo.org}`)'
      - 'traefik.http.routers.polycarp.entrypoints=websecure'
      - 'traefik.http.routers.polycarp.tls.certresolver=letsencrypt'
      - 'traefik.http.services.polycarp.loadbalancer.server.port=80'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    # No cap_drop: ALL — nginx needs CHOWN/SETUID/SETGID to spawn its workers.
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    ulimits:
      core: 0
    tmpfs:
      - /usr/share/nginx:size=64m
      - /var/cache/nginx:size=50m
      - /var/run:size=10m
      - /tmp:size=10m
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    restart: unless-stopped
    stop_grace_period: 3s
    depends_on:
      - backend

  backend:
    # Externally built ML/XTB image: its required capabilities and temp paths are
    # unknown, so cap_drop and read_only are deliberately omitted here.
    image: ${BACKEND_IMAGE:-ghcr.io/lamalab-org/copolymer-reactivity:latest}
    env_file: .env
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    cpus: 2
    pids_limit: 512
    ulimits:
      core: 0
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  traefik:
    external: true
